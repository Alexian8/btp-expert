# ═══════════════════════════════════════════════════════════════════════════
# project.yml — définition XcodeGen du projet iOS BatiDesk.
#
# Le dépôt contient déjà un BatiDesk.xcodeproj prêt à l'emploi. Ce fichier
# sert de FILET DE SÉCURITÉ : si le .xcodeproj refuse de s'ouvrir (version
# d'Xcode différente, conflit de merge…), on le régénère proprement :
#
#     brew install xcodegen      # une seule fois
#     cd apps/ios
#     xcodegen generate          # réécrit BatiDesk.xcodeproj
#
# ═══════════════════════════════════════════════════════════════════════════
name: BatiDesk

options:
  bundleIdPrefix: fr.jacobhabitat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""           # ← renseigne ton Team ID Apple Developer

targets:
  BatiDesk:
    type: application
    platform: iOS
    sources:
      - path: BatiDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jacobhabitat.batidesk
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BatiDesk/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone uniquement
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
